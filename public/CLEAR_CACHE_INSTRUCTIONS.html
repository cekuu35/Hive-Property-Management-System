<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear All Caches - Lovly Property Management</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .status {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .success {
            background: #f0fdf4;
            border-left-color: #22c55e;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        #log {
            background: #1e293b;
            color: #10b981;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
        }
        .warning {
            background: #fef3c7;
            border-left-color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear All Caches</h1>
        
        <div class="status warning">
            <strong>⚠️ Important:</strong> This will clear ALL cached data including localStorage, sessionStorage, service workers, and browser caches.
        </div>

        <button onclick="clearAllCaches()">🗑️ Clear All Caches Now</button>
        <button onclick="window.location.href='/'">🏠 Return to App</button>

        <div id="log"></div>
    </div>

    <script>
        const log = document.getElementById('log');
        
        function addLog(message, isSuccess = true) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `${isSuccess ? '✅' : '❌'} ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        async function clearAllCaches() {
            log.innerHTML = '';
            addLog('Starting cache clearing process...');
            
            // 1. Clear localStorage
            try {
                localStorage.clear();
                addLog('localStorage cleared');
            } catch (e) {
                addLog('Failed to clear localStorage: ' + e.message, false);
            }
            
            // 2. Clear sessionStorage
            try {
                sessionStorage.clear();
                addLog('sessionStorage cleared');
            } catch (e) {
                addLog('Failed to clear sessionStorage: ' + e.message, false);
            }
            
            // 3. Unregister all service workers
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                        addLog(`Service worker unregistered: ${registration.scope}`);
                    }
                    if (registrations.length === 0) {
                        addLog('No service workers to unregister');
                    }
                } catch (e) {
                    addLog('Failed to unregister service workers: ' + e.message, false);
                }
            } else {
                addLog('Service workers not supported');
            }
            
            // 4. Clear all caches
            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    for (const name of cacheNames) {
                        await caches.delete(name);
                        addLog(`Cache deleted: ${name}`);
                    }
                    if (cacheNames.length === 0) {
                        addLog('No caches to delete');
                    }
                } catch (e) {
                    addLog('Failed to clear caches: ' + e.message, false);
                }
            } else {
                addLog('Cache API not supported');
            }
            
            // 5. Clear IndexedDB
            if ('indexedDB' in window) {
                try {
                    const dbs = await indexedDB.databases();
                    for (const db of dbs) {
                        if (db.name) {
                            indexedDB.deleteDatabase(db.name);
                            addLog(`IndexedDB deleted: ${db.name}`);
                        }
                    }
                    if (dbs.length === 0) {
                        addLog('No IndexedDB databases to delete');
                    }
                } catch (e) {
                    addLog('Failed to clear IndexedDB: ' + e.message, false);
                }
            }
            
            addLog('');
            addLog('✅ ALL CACHES CLEARED!');
            addLog('');
            addLog('🔄 Please close this tab and hard refresh the app:');
            addLog('   Windows/Linux: Ctrl + Shift + R');
            addLog('   Mac: Cmd + Shift + R');
            
            // Auto-redirect after 3 seconds
            setTimeout(() => {
                addLog('');
                addLog('Redirecting to app in 3 seconds...');
                setTimeout(() => window.location.href = '/', 3000);
            }, 2000);
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            addLog('Page loaded. Click the button above to clear all caches.');
        });
    </script>
</body>
</html>
