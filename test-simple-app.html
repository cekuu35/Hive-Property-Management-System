<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Manager - Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Property Manager Pro</h1>
        <h2>M-Pesa Integration Test Page</h2>
        
        <div id="status" class="status info">
            Testing app connectivity...
        </div>
        
        <div id="results"></div>
        
        <button onclick="testBackend()">Test Backend API</button>
        <button onclick="testMpesa()">Test M-Pesa Integration</button>
        <button onclick="window.open('http://localhost:5173', '_blank')">Open Main App</button>
        
        <div style="margin-top: 20px;">
            <h3>Quick Access Links:</h3>
            <p><a href="http://localhost:5173" target="_blank">Main App (React)</a></p>
            <p><a href="http://localhost:3001/api/health" target="_blank">Backend API Health</a></p>
        </div>
    </div>

    <script>
        async function testBackend() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.textContent = 'Testing backend API...';
            statusDiv.className = 'status info';
            
            try {
                const response = await fetch('http://localhost:3001/api/health');
                const data = await response.json();
                
                if (response.ok) {
                    statusDiv.textContent = '✅ Backend API is working!';
                    statusDiv.className = 'status success';
                    resultsDiv.innerHTML = `
                        <div class="status success">
                            <strong>Backend Status:</strong> ${data.status}<br>
                            <strong>Message:</strong> ${data.message}<br>
                            <strong>Endpoints:</strong> ${data.endpoints?.length || 'Multiple'} available
                        </div>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                statusDiv.textContent = '❌ Backend API failed';
                statusDiv.className = 'status error';
                resultsDiv.innerHTML = `
                    <div class="status error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        async function testMpesa() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.textContent = 'Testing M-Pesa integration...';
            statusDiv.className = 'status info';
            
            try {
                const response = await fetch('http://localhost:3001/api/mpesa/rent-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        leaseId: '7bfd4299-e952-4d03-ac60-44b465626895',
                        amount: 100,
                        phoneNumber: '254708374149'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusDiv.textContent = '✅ M-Pesa integration is working!';
                    statusDiv.className = 'status success';
                    resultsDiv.innerHTML = `
                        <div class="status success">
                            <strong>M-Pesa Status:</strong> Working<br>
                            <strong>Response:</strong> ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                } else {
                    statusDiv.textContent = '⚠️ M-Pesa integration has issues';
                    statusDiv.className = 'status error';
                    resultsDiv.innerHTML = `
                        <div class="status error">
                            <strong>Error:</strong> ${data.error || 'Unknown error'}<br>
                            <strong>Details:</strong> ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                statusDiv.textContent = '❌ M-Pesa integration failed';
                statusDiv.className = 'status error';
                resultsDiv.innerHTML = `
                    <div class="status error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            testBackend();
        };
    </script>
</body>
</html>
