<!DOCTYPE html>
<html>
<head>
  <title>Test Password Reset Function</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    input, button { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; }
    button { background: #667eea; color: white; border: none; cursor: pointer; }
    button:hover { background: #764ba2; }
    #result { margin-top: 20px; padding: 15px; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <h1>🧪 Test Password Reset Function</h1>
  
  <div>
    <label>Email Address:</label>
    <input type="email" id="email" placeholder="Enter email to test" value="felixsankii@gmail.com">
  </div>

  <button onclick="testPasswordReset()">🔐 Test Password Reset</button>

  <div id="result"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Your Supabase credentials
    const SUPABASE_URL = 'https://kozhlejudselgtmohdfm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvemhsZWp1ZHNlbGd0bW9oZGZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg1NDk5OTUsImV4cCI6MjA0NDEyNTk5NX0.i09iYvPAVFLNpckMwXv_WAJFrtTfQWonXgf0Ye_x_3g';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testPasswordReset() {
      const email = document.getElementById('email').value;
      const resultDiv = document.getElementById('result');
      
      resultDiv.innerHTML = '<div class="info">⏳ Testing password reset function...</div>';

      try {
        console.log('📧 Testing password reset for:', email);

        const { data, error } = await supabase.functions.invoke('send-password-reset', {
          body: { email: email }
        });

        console.log('Response:', { data, error });

        if (error) {
          resultDiv.innerHTML = `
            <div class="error">
              <h3>❌ Error</h3>
              <p><strong>Message:</strong> ${error.message}</p>
              <pre>${JSON.stringify(error, null, 2)}</pre>
            </div>
          `;
          return;
        }

        if (data && data.success) {
          resultDiv.innerHTML = `
            <div class="success">
              <h3>✅ Success!</h3>
              <p><strong>Message:</strong> ${data.message}</p>
              ${data.resetLink ? `<p><strong>Reset Link (testing):</strong></p><pre>${data.resetLink}</pre>` : ''}
              <p style="margin-top: 15px;">📧 Check your email inbox (and spam folder) for the password reset link.</p>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="error">
              <h3>⚠️ Unexpected Response</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        }

      } catch (err) {
        console.error('Error:', err);
        resultDiv.innerHTML = `
          <div class="error">
            <h3>❌ Exception</h3>
            <p>${err.message}</p>
            <pre>${JSON.stringify(err, null, 2)}</pre>
            <hr>
            <h4>💡 Troubleshooting:</h4>
            <ul>
              <li>Check if the <code>send-password-reset</code> function is deployed in Supabase</li>
              <li>Check if BREVO_API_KEY is set in Supabase secrets</li>
              <li>Check browser console for detailed errors</li>
            </ul>
          </div>
        `;
      }
    }
  </script>

  <div style="margin-top: 30px; padding: 15px; background: #f8f9fa; border-radius: 5px;">
    <h3>📋 Checklist:</h3>
    <ul>
      <li>✅ Edge function <code>send-password-reset</code> is deployed</li>
      <li>✅ Database table <code>password_reset_tokens</code> exists</li>
      <li>✅ BREVO_API_KEY is set in Supabase secrets</li>
      <li>✅ FROM_EMAIL is set in Supabase secrets</li>
    </ul>
  </div>
</body>
</html>
