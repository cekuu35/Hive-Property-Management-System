name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web assets
      run: npm run build
      env:
        CI: false
    
    - name: Generate Upload Keystore (BEFORE Capacitor sync)
      run: |
        mkdir -p android/app
        cd android/app
        # Generate keystore
        keytool -genkeypair -v \
          -storetype PKCS12 \
          -keystore upload-keystore.jks \
          -alias hive-property-upload \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass hive_property_2024_secure \
          -keypass hive_property_2024_secure \
          -dname "CN=Hive Property Management, OU=Mobile, O=Hive, L=Nairobi, ST=Nairobi, C=KE"
        # Create properties file
        echo "storePassword=hive_property_2024_secure" > upload-keystore.properties
        echo "keyPassword=hive_property_2024_secure" >> upload-keystore.properties
        echo "keyAlias=hive-property-upload" >> upload-keystore.properties
        echo "storeFile=upload-keystore.jks" >> upload-keystore.properties
        ls -la
        
    - name: Setup Capacitor
      run: |
        npx cap sync android
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Android APK (Release - Signed)
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hive-property-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        
    - name: Create Release Info
      run: |
        echo "### 📱 APK Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**App:** Hive Property Management" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** 1.0" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** com.hive.propertymanagement" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the APK from the artifacts section above ⬆️" >> $GITHUB_STEP_SUMMARY

