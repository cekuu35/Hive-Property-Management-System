name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Restore cached debug keystore (stable signature)
      id: keystore-cache
      uses: actions/cache@v4
      with:
        path: |
          android/app/upload-keystore.jks
          android/app/upload-keystore.properties
        key: debug-keystore-v1
    
    - name: Generate version number
      id: version
      run: |
        if [ "${{ github.event.inputs.version }}" != "auto" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          # Auto-increment version based on commit count
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.$COMMIT_COUNT"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        echo "📱 Building version: $VERSION (code: $COMMIT_COUNT)"
        
    - name: Install dependencies
      run: npm install
      
    - name: Build optimized web assets
      run: npm run build
      env:
        CI: false
        NODE_ENV: production
      
    - name: Optimize bundle size
      run: |
        echo "📦 Analyzing bundle size..."
        du -sh dist/
        echo "Optimizing assets..."
        # Remove source maps for production
        find dist -name "*.map" -type f -delete
        # Show final size
        FINAL_SIZE=$(du -sh dist/ | cut -f1)
        echo "✅ Final bundle size: $FINAL_SIZE"
        
    - name: Update Android version
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
        # Update versionName and versionCode in build.gradle
        sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
        echo "✅ Updated to version $VERSION (code: $VERSION_CODE)"
        
    - name: Setup Capacitor
      run: |
        npx cap sync android
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    
    - name: Ensure stable debug keystore exists
      run: |
        set -e
        cd android/app
        if [ -f upload-keystore.jks ] && [ -f upload-keystore.properties ]; then
          echo "Keystore already present (restored from cache)."
        else
          echo "Generating stable debug keystore..."
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass hive2025 \
            -keypass hive2025 \
            -dname "CN=Hive Property (Debug), OU=Dev, O=Hive, L=Nairobi, ST=Nairobi, C=KE"

          echo "storeFile=upload-keystore.jks" > upload-keystore.properties
          echo "storePassword=hive2025" >> upload-keystore.properties
          echo "keyAlias=upload" >> upload-keystore.properties
          echo "keyPassword=hive2025" >> upload-keystore.properties
          echo "✅ Stable debug keystore generated"
        fi
      
    - name: Build signed universal APK (Release, debug keystore)
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace
        
    - name: Verify APK signature and metadata
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        APK_PATH=android/app/build/outputs/apk/release/app-release.apk
        echo "Verifying APK signature..."
        jarsigner -verify -verbose -certs "$APK_PATH" || true
        echo "apksigner verify (if available)..."
        if command -v apksigner >/dev/null 2>&1; then
          apksigner verify --print-certs "$APK_PATH" || true
        fi
        echo "Listing ABIs in APK (if any native libs present)..."
        unzip -l "$APK_PATH" | grep -E "^\s+.*lib/(arm|armeabi|arm64|x86)" || true
        echo "SDK versions (manifest dump if aapt exists)..."
        if command -v aapt >/dev/null 2>&1; then
          aapt dump badging "$APK_PATH" | grep -E "sdkVersion|targetSdkVersion" || true
        fi

    - name: Rename APK (universal, signed)
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        mkdir -p release
        cp android/app/build/outputs/apk/release/app-release.apk \
           release/HiveProperty-v$VERSION.apk
        
        # Get APK size
        APK_SIZE=$(du -h release/HiveProperty-v$VERSION.apk | cut -f1)
        echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
        echo "📱 APK Size: $APK_SIZE"
        
    - name: Generate release notes
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        cat > release_notes.md << EOF
        ## 📱 Hive Property Management v$VERSION
        
        ### 🚀 What's New
        - Built from commit: \`${GITHUB_SHA:0:7}\`
        - Build date: $(date '+%Y-%m-%d %H:%M:%S UTC')
        - APK size: ${{ env.APK_SIZE }}
        
        ### 📥 Installation Instructions
        
        #### On Your Android Phone:
        1. **Tap** the APK file below to download
        2. **Open** the downloaded file
        3. **Enable** "Install unknown apps" if prompted
        4. **Tap Install**
        5. **Open** and enjoy! 🎉
        
        #### Features:
        - ✅ Property & Tenant Management
        - ✅ M-Pesa Payment Integration
        - ✅ Push Notifications (99% reliability)
        - ✅ Offline Support
        - ✅ Camera & Document Upload
        - ✅ Real-time Updates
        
        ### 🔧 Technical Details
        - **Minimum Android:** 6.0 (API 23)
        - **Target Android:** 14 (API 34)
        - **Package:** com.hive.propertymanagement
        - **Architecture:** Universal (ARM, ARM64, x86)
        
        ### 📱 Quick Mobile Download
        On your Android phone:
        1. Open this page in Chrome/Edge
        2. Scroll down to "Assets"
        3. Tap "HiveProperty-v$VERSION.apk"
        4. Install & enjoy!
        
        ---
        
        **Need help?** Open an issue or contact support.
        EOF
        
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: Hive Property v${{ steps.version.outputs.VERSION }}
        body_path: release_notes.md
        files: |
          release/HiveProperty-v${{ steps.version.outputs.VERSION }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload APK artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: hive-property-v${{ steps.version.outputs.VERSION }}
        path: release/HiveProperty-v${{ steps.version.outputs.VERSION }}.apk
        retention-days: 90
        
    - name: Build summary
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        echo "### 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v$VERSION" >> $GITHUB_STEP_SUMMARY
        echo "**APK Size:** ${{ env.APK_SIZE }}" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** com.hive.propertymanagement" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download Options" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "1. **GitHub Releases** (Recommended for mobile):" >> $GITHUB_STEP_SUMMARY
        echo "   - Go to: [Releases](../../releases)" >> $GITHUB_STEP_SUMMARY
        echo "   - Download: HiveProperty-v$VERSION.apk" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "2. **Artifacts** (Backup):" >> $GITHUB_STEP_SUMMARY
        echo "   - Available in artifacts section above ⬆️" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Mobile Installation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "On your Android phone:" >> $GITHUB_STEP_SUMMARY
        echo "1. Open GitHub in browser" >> $GITHUB_STEP_SUMMARY
        echo "2. Navigate to Releases tab" >> $GITHUB_STEP_SUMMARY
        echo "3. Tap the APK to download" >> $GITHUB_STEP_SUMMARY
        echo "4. Install and enjoy! 🚀" >> $GITHUB_STEP_SUMMARY

